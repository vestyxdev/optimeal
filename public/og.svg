<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- jemná textura supermarketové etikety: opakující se řezy -->
    <pattern id="ryhy" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="26" stroke="#1d5c36" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd457"/>
      <stop offset="1" stop-color="#a8bd45"/>
    </linearGradient>
  </defs>

  <!-- hluboká lesní zeleň -->
  <rect width="1200" height="630" fill="#144227"/>
  <rect width="1200" height="630" fill="url(#ryhy)"/>

  <!-- vodoznak Kč -->
  <text x="1010" y="560" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="330" fill="#1d5c36" opacity="0.5" text-anchor="middle">Kč</text>

  <!-- slevová cedulka (cenovka) -->
  <g transform="translate(890,120) rotate(8)">
    <path d="M0 0 h190 l46 46 v150 a14 14 0 0 1 -14 14 h-208 a14 14 0 0 1 -14 -14 v-182 a14 14 0 0 1 14 -14 z" fill="url(#badge)"/>
    <path d="M190 0 l46 46 h-46 z" fill="#8a9a35"/>
    <circle cx="26" cy="26" r="9" fill="#144227"/>
    <text x="113" y="118" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="62" fill="#3d4313" text-anchor="middle">-20%</text>
    <text x="113" y="156" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="24" fill="#3d4313" text-anchor="middle">SLEVY</text>
  </g>

  <!-- lístek / účtenka u spodní hrany -->
  <g transform="translate(0,486)">
    <rect width="1200" height="144" fill="#f8f7f1"/>
    <line x1="0" y1="8" x2="1200" y2="8" stroke="#d8d5c4" stroke-width="3" stroke-dasharray="14 10"/>
    <!-- položky účtenky -->
    <text x="80" y="66" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="30" fill="#686b5f">Kuřecí prsa 300 g</text>
    <text x="1120" y="66" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="30" fill="#20231e" text-anchor="end">29,90 Kč</text>
    <text x="80" y="112" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="30" fill="#686b5f">Úspora za týden</text>
    <text x="1120" y="112" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="30" fill="#1d5c36" text-anchor="end">248 Kč</text>
  </g>

  <!-- značka -->
  <g transform="translate(80,118)">
    <!-- favicon list -->
    <g transform="translate(0,-6) scale(1.5)">
      <rect width="64" height="64" rx="14" fill="#a4cd5c"/>
      <path d="M46 16c-14 0-24 8-24 20 0 3 .7 5.6 2 8-1.6-9.4 3.4-16.4 12-20-7 5-10.6 11-10.2 19 1.9 1.3 4.3 2 7 2 12 0 16-13 13.2-29z" fill="#144227"/>
      <circle cx="44" cy="18" r="2.4" fill="#f8f7f1"/>
    </g>
    <text x="112" y="55" font-family="Bricolage Grotesque, Inter, Arial, sans-serif" font-weight="800" font-size="58" fill="#f8f7f1">OptiMeal</text>
  </g>

  <!-- headline -->
  <text x="80" y="290" font-family="Bricolage Grotesque, Inter, Arial, sans-serif" font-weight="800" font-size="88" fill="#f8f7f1">Jezte lépe,</text>
  <text x="80" y="390" font-family="Bricolage Grotesque, Inter, Arial, sans-serif" font-weight="800" font-size="88" fill="#a4cd5c">šetřete peníze.</text>

  <!-- podtitul -->
  <text x="80" y="448" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="32" fill="#c9d6c4">Jídelníček na míru · mealprep · nákupní seznamy s aktuálními slevami</text>
</svg>
