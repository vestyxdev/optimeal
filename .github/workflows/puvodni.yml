# PuvodniCeny – dohledání původních (přeškrtnutých) cen z detailů kupi.cz.
#
# Běží jako VLASTNÍ workflow po dokončení PriceScraperu. Dřív byl jobem
# `puvodni` uvnitř PriceScraperu s `needs: scrape` – čekal až na celou
# 16jobovou matici (max-parallel:2 ≈ hodiny) a rerun spadlých legů přes
# ScraperRetry ho zrušil → obohacení se nikdy nedokončilo. Oddělený
# workflow se spustí po každém dokončení (i po rerun – modul je
# idempotentní, zpracuje jen chybějící slugs s dedupe).
name: PuvodniCeny

on:
  workflow_run:
    workflows: ["PriceScraper"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puvodni:
    # success i failure – zdrojových dat může být dost i při spadlých legech
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper.obohaceni_puvodni --limit 600
