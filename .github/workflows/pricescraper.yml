# PriceScraper – denní scraping letákových/eshopových slev.
# Běží každou noc ~02:00 CET (01:00 UTC; v letním čase 03:00 CET).
# Secrets v GitHub repo:
#   SUPABASE_URL              – https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY – service-role klíč (jen server-side!)
#
# ARCHITEKTURA: každý řetězec běží jako SAMOSTATNÝ matrix job =
# vlastní runner + vlastní egress IP. kupi.cz občas 403-í GitHub
# datacenter IP; jeden zablokovaný job tak shodí jen svůj řetězec,
# ne celý běh. fail-fast:false + purge per-zdroj = izolace.
name: PriceScraper

on:
  schedule:
    - cron: "0 1 * * *"  # ~02:00 CET každou noc
    - cron: "0 5 * * *"  # pojistný pokus ~06:00 CET – nový runner = nová IP
                         # (kupi.cz občas 403-í GitHub egress IP, druhá
                         #  šance zvýší pravděpodobnost čistého běhu)
  workflow_dispatch:
    inputs:
      obchod:
        description: "Jen jeden řetězec (volitelné: Kaufland, Lidl, …)"
        required: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false   # zablokovaný/zhasnutý řetězec neruší ostatní joby
      max-parallel: 2    # max 2 souběžné IP proti kupi.cz – působí přirozeně
      matrix:
        # dispatch s --obchod = matrix o jednom prvku, jinak všech 7
        obchod: ${{ github.event.inputs.obchod != ''
                    && fromJSON(format('["{0}"]', github.event.inputs.obchod))
                    || fromJSON('["Kaufland","Lidl","Albert","Billa","Tesco","Penny","Globus"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r scraper/requirements.txt

      # max-parallel:2 startuje dvojice jobů ve stejnou sekundu – náhodný
      # úvodní posun rozloží dotazy na kupi.cz a sníží šanci na 403
      - name: Náhodný úvodní posun proti 403
        run: sleep $((RANDOM % 90))
        shell: bash

      - name: Scrape ${{ matrix.obchod }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper.ceniky --obchod "${{ matrix.obchod }}"
