# Automatický ingest cen do price_observations.
# Secrets potřebné v GitHub repo nastavení:
#   SUPABASE_URL              – https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY – service-role klíč (jen server-side!)
name: Ingest cen

on:
  schedule:
    - cron: "23 4 * * *"  # denně ~5:23 CET
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r scraper/requirements.txt

      - name: Stáhnout a zapsat ceny
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper
