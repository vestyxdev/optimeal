# ScraperRetry – automatické přehrání spadlých scrape jobů.
#
# Kupi.cz i eshopy občas IP-blokují GitHub datacenter – celý matrix leg
# pak chytá 403 na každý request (retry/backoff nepomůže, blok je na IP).
# `gh run rerun --failed` dostane NOVÉ runnery = nové IP, takže druhý
# pokus typicky projde. Pojistka: max 2 rerun pokusy (run_attempt < 4).
name: ScraperRetry

on:
  workflow_run:
    workflows: ["PriceScraper", "AsortimentScraper"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Přehraj spadlé joby (nová IP)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ATTEMPT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq .run_attempt)
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "Už $ATTEMPT. pokus – další rerun se nekoná (blokace trvá)."
            exit 0
          fi
          echo "Run $RUN_ID, pokus $ATTEMPT → rerun --failed (nové runner IP)"
          gh run rerun "$RUN_ID" --failed
