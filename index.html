<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OptiMeal – jezte lépe, šetřete peníze, plánujte chytře. Osobní jídelníček, mealprep a nákupní seznamy s aktuálními slevami z obchodů." />
    <meta name="theme-color" content="#0a0e0b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OptiMeal – jezte lépe, šetřete peníze" />
    <meta property="og:description" content="Osobní jídelníček podle vašich cílů, mealprep a nákupní seznamy s aktuálními slevami z českých obchodů." />
    <meta property="og:locale" content="cs_CZ" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>OptiMeal – jezte lépe, šetřete peníze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <script>
      // motiv dříve, než se cokoliv vykreslí – žádné probliknutí
      (function () {
        try {
          var motiv = localStorage.getItem("optimeal-motiv") || "dark";
          var dark =
            motiv === "dark" ||
            (motiv === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage nedostupný – zůstane světlý motiv */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 32rem; margin: 4rem auto; padding: 0 1rem; font-family: sans-serif; text-align: center">
        <h1>OptiMeal</h1>
        <p>Pro použití aplikace je potřeba povolit JavaScript v prohlížeči.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
